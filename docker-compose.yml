version: '3.9'

# ponytail: the only service that may be reachable from outside the Docker
# network is the API gateway. Everything else uses `expose` (internal only), so
# the gateway is the single hop that may set X-Forwarded-For — the auth
# service trusts one proxy hop, and a directly-published auth service would
# let a client forge that header and mint a fresh rate-limit bucket per
# request.
services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: krt-api-gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4321}
      - AUTH_SERVICE_URL=http://auth-service:3002
      - CATALOG_SERVICE_URL=http://catalog-service:3003
      - CART_SERVICE_URL=http://cart-service:3004
      - ORDER_SERVICE_URL=http://order-service:3005
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      # ponytail: set this ONLY when a reverse proxy sits in front of the
      # gateway, and unpublish the gateway's port when you do. Without it the
      # limiter sees the proxy's address and every customer shares one bucket
      # (5 orders/min for the whole store). Example: TRUST_PROXY=loopback
      - TRUST_PROXY=${TRUST_PROXY:-}
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - krt-network

  auth-service:
    build:
      context: ./services/auth-service
    container_name: krt-auth-service
    expose:
      - "3002"
    # ponytail: the ArgonVault pepper is REQUIRED — without it every
    # registration 500s, every password check silently fails, and account
    # existence leaks through response time. It lives outside the build
    # context on purpose (it is a secret), so it is mounted, not copied.
    volumes:
      - ${ARGONVAULT_PEPPER_FILE:-./brunoash alogritm/pepper.key}:/run/secrets/pepper.key:ro
      - auth-db:/app/data
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - ARGONVAULT_PEPPER_PATH=/run/secrets/pepper.key
      - AUTH_DB_PATH=/app/data/auth.db
      # ponytail: NODE_ENV=production is what turns on the Secure cookie flag
      # and turns OFF the dev-only "print the OTP to stdout" path. Leaving it
      # unset silently took the dev path in production.
      - NODE_ENV=production
      # ponytail: required, and no default. The old default was a 24-character
      # literal committed to the repo, which the new >=32-character boot check
      # rejects — the container would exit 1 on every start.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to at least 32 characters}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4321}
      # ponytail: the gateway is a different container, so the auth service
      # cannot trust the X-Forwarded-For header from loopback. This names
      # the Docker network range whose hops ARE trusted. If this service is
      # ever published to the internet, narrow this to the gateway's
      # address -- a client that can connect directly would otherwise be
      # able to forge its own address and mint a fresh rate-limit bucket.
      - TRUST_PROXY=${TRUST_PROXY:-172.16.0.0/12}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      - NOTIFY_TOKEN=${NOTIFY_TOKEN:?NOTIFY_TOKEN must be set}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4321}
      - STORE_NAME=${STORE_NAME:-KRT Store}
    depends_on:
      - notification-service
    networks:
      - krt-network

  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: krt-catalog-service
    expose:
      - "3003"
    environment:
      - PORT=3003
      - HOST=0.0.0.0
      - NODE_ENV=production
    networks:
      - krt-network

  cart-service:
    build:
      context: ./services/cart-service
    container_name: krt-cart-service
    expose:
      - "3004"
    environment:
      - PORT=3004
      - HOST=0.0.0.0
      - NODE_ENV=production
    networks:
      - krt-network

  order-service:
    build:
      context: ./services/order-service
    container_name: krt-order-service
    expose:
      - "3005"
    environment:
      - PORT=3005
      - HOST=0.0.0.0
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3002
      # ponytail: the order service prices the order itself now -- the price
      # in the request body is ignored, so the catalog service is a hard
      # dependency. Without this line the container resolves localhost:3003
      # to ITSELF and every order fails with 503.
      - CATALOG_SERVICE_URL=http://catalog-service:3003
      # ponytail: the order service creates and CAPTURES the payment itself,
      # server to server, so it needs the payment service's address.
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      - NOTIFY_TOKEN=${NOTIFY_TOKEN:?NOTIFY_TOKEN must be set}
      - STORE_NAME=${STORE_NAME:-KRT Store}
    depends_on:
      - auth-service
      - catalog-service
      - payment-service
      - notification-service
    networks:
      - krt-network

  notification-service:
    build:
      context: ./services/notification-service
    container_name: krt-notification-service
    expose:
      - "8000"
    environment:
      - NODE_ENV=production
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - STORE_OWNER_EMAIL=${STORE_OWNER_EMAIL:-}
      - STORE_NAME=${STORE_NAME:-KRT Store}
      # ponytail: required. The service now refuses to start without it — an
      # empty token used to disable the check entirely, leaving /notify/otp
      # open to anyone.
      - NOTIFY_TOKEN=${NOTIFY_TOKEN:?NOTIFY_TOKEN must be set}
    networks:
      - krt-network

  payment-service:
    build:
      context: ./services/payment-service
    container_name: krt-payment-service
    expose:
      - "3006"
    environment:
      - PORT=3006
      - HOST=0.0.0.0
      - NODE_ENV=production
      # ponytail: same reason as the order service -- the amount is derived
      # from the catalog, so the container needs the catalog's address.
      - CATALOG_SERVICE_URL=http://catalog-service:3003
    depends_on:
      - catalog-service
    networks:
      - krt-network

networks:
  krt-network:
    driver: bridge

volumes:
  # The auth database is a runtime artifact (password hashes, refresh tokens).
  # It was previously committed to git and shipped inside the image.
  auth-db:
